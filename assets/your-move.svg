<svg xmlns="http://www.w3.org/2000/svg" width="500" height="460" viewBox="0 0 500 460" fill="none">
  <title>A good move at the café</title>
  <desc>An original vintage illustration of a cheerful coffee cup and a green meeple on a little game board, with playing cards and dice.</desc>
  <defs>
    <pattern id="paper-dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#252b28" opacity=".18"/>
    </pattern>
    <pattern id="card-weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="m7 2 5 5-5 5-5-5Z" stroke="#fff7df" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="1.2" fill="#fff7df"/>
      <circle cx="14" cy="14" r="1.2" fill="#fff7df"/>
    </pattern>
    <pattern id="diagonal-ink" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0V6" stroke="#252b28" stroke-width="1" opacity=".3"/>
    </pattern>
    <clipPath id="cup-body">
      <path d="M145 177h120l-12 103c-1 16-20 25-46 25s-44-9-47-25Z"/>
    </clipPath>
    <clipPath id="meeple-shape">
      <path d="M327 176c-9-8-13-16-9-26 4-13 15-21 29-21s25 8 29 21c4 10 0 18-9 26l35 28c7 5 8 11 4 17-3 5-8 6-14 4l-22-7 17 61c2 8-2 13-10 13h-23l-8-38-8 38h-23c-8 0-12-5-10-13l17-61-22 7c-6 2-11 1-14-4-4-6-3-12 4-17Z"/>
    </clipPath>
  </defs>

  <!-- Loose marks keep the composition airy, like pieces tipped from a game box. -->
  <g stroke="#252b28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="m425 100 4 12 12 4-12 4-4 12-4-12-12-4 12-4Z" fill="#f5bd48"/>
    <path d="m58 227 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#f1593d"/>
    <path d="m417 250 10 3m-4-16 8-5m-26-2 2-9"/>
    <path d="m86 75 4-9m5 19 10-3m-28 3-6-6"/>
    <path d="m306 63 6-9m5 19 11-1m-29 1-4-7"/>
    <circle cx="443" cy="210" r="4" fill="#f1593d"/>
    <circle cx="78" cy="271" r="3" fill="#28624a" stroke="none"/>
    <circle cx="307" cy="101" r="3" fill="#252b28" stroke="none"/>
  </g>

  <!-- A genuinely fanned little deck, with original geometric card backs. -->
  <g stroke="#252b28" stroke-width="3" stroke-linejoin="round">
    <g transform="translate(55 113) rotate(-23 48 63)">
      <rect x="3" y="4" width="93" height="126" rx="8" fill="#252b28"/>
      <rect width="93" height="126" rx="8" fill="#fff7df"/>
      <rect x="7" y="7" width="79" height="112" rx="4" fill="#f1593d"/>
      <rect x="12" y="12" width="69" height="102" rx="2" fill="url(#card-weave)" stroke="#fff7df" stroke-width="1.5"/>
      <path d="m47 40 17 23-17 23-18-23Z" fill="#fff7df"/>
      <path d="m47 51 9 12-9 12-9-12Z" fill="#f5bd48" stroke-width="2"/>
    </g>
    <g transform="translate(87 96) rotate(-8 48 63)">
      <rect x="3" y="4" width="93" height="126" rx="8" fill="#252b28"/>
      <rect width="93" height="126" rx="8" fill="#fff7df"/>
      <rect x="7" y="7" width="79" height="112" rx="4" fill="#a5c8ce"/>
      <path d="M13 26h67M13 35h67M13 91h67M13 100h67" stroke-width="1.2"/>
      <circle cx="46.5" cy="63" r="23" fill="#fff7df"/>
      <path d="m46 46 4 12 13 5-13 4-4 13-4-13-13-4 13-5Z" fill="#f1593d" stroke-width="2"/>
    </g>
    <g transform="translate(116 103) rotate(10 48 63)">
      <rect x="3" y="4" width="93" height="126" rx="8" fill="#252b28"/>
      <rect width="93" height="126" rx="8" fill="#fff7df"/>
      <rect x="7" y="7" width="79" height="112" rx="4" stroke-width="1.3"/>
      <path d="m17 17 5 7-5 7-5-7Zm59 78 5 7-5 7-5-7Z" fill="#f1593d" stroke-width="1.5"/>
      <path d="M39 53c-8-10-4-24 8-24s16 14 8 24l15 12-13 7 7 24H52l-5-17-5 17H30l7-24-13-7Z" fill="#28624a" stroke-width="2.3"/>
      <path d="M31 104h32" stroke-width="1.3"/>
    </g>
  </g>

  <!-- Board: square artwork projected into a simple, readable isometric plane. -->
  <g stroke="#252b28" stroke-linejoin="round">
    <path d="m85 326 172 88 172-88v13l-172 88-172-88Z" fill="#f5bd48" stroke-width="3.2"/>
    <path d="M257 414v13l172-88v-13Z" fill="#28624a" stroke-width="3.2"/>
    <g transform="matrix(.82 .42 -.82 .42 257 238)">
      <rect width="210" height="210" fill="#fff7df" stroke-width="4"/>
      <path d="M0 0h210v36H0ZM0 174h210v36H0ZM0 36h36v138H0ZM174 36h36v138h-36Z" fill="#a5c8ce" stroke-width="2.5"/>
      <path d="M0 0h36v36H0ZM174 0h36v36h-36ZM0 174h36v36H0ZM174 174h36v36h-36Z" fill="#f1593d" stroke-width="2.5"/>
      <path d="M70 0h35v36H70ZM105 174h35v36h-35ZM0 70h36v35H0ZM174 105h36v35h-36Z" fill="#f5bd48" stroke-width="2.5"/>
      <path d="M36 0v36m104-36v36M36 174v36m34-36v36m104-36v36M0 140h36m-36 34h36M174 36h36m-36 34h36" stroke-width="2.5"/>
      <rect x="45" y="45" width="120" height="120" fill="#fff7df" stroke-width="2"/>
      <rect x="51" y="51" width="108" height="108" fill="url(#paper-dots)" stroke="none"/>
      <path d="m83 105 22-26 22 26-22 26Z" fill="#28624a" stroke-width="2.5"/>
      <path d="m96 105 9-11 9 11-9 11Z" fill="#f5bd48" stroke-width="1.7"/>
      <path d="m11 17 7-7 7 7-7 7Zm174 0 7-7 7 7-7 7ZM11 192l7-7 7 7-7 7Zm174 0 7-7 7 7-7 7Z" fill="#fff7df" stroke-width="1.5"/>
      <path d="M79 17h17m-6-6 6 6-6 6M113 193h17m-6-6 6 6-6 6M18 79v17m-6-6 6 6 6-6M192 113v17m-6-6 6 6 6-6" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Steam is drawn as ink, rather than a soft digital effect. -->
  <g stroke="#252b28" stroke-width="3" stroke-linecap="round">
    <path d="M207 139c-19-16 14-24-2-40"/>
    <path d="M233 143c-14-13 11-20 1-33"/>
    <path d="M186 135c-10-9-2-17 3-23" stroke-width="2"/>
  </g>

  <!-- The meeple has a small ink offset and engraved printing marks. -->
  <path d="M333 182c-9-8-13-16-9-26 4-13 15-21 29-21s25 8 29 21c4 10 0 18-9 26l35 28c7 5 8 11 4 17-3 5-8 6-14 4l-22-7 17 61c2 8-2 13-10 13h-23l-8-38-8 38h-23c-8 0-12-5-10-13l17-61-22 7c-6 2-11 1-14-4-4-6-3-12 4-17Z" fill="#252b28"/>
  <path d="M327 176c-9-8-13-16-9-26 4-13 15-21 29-21s25 8 29 21c4 10 0 18-9 26l35 28c7 5 8 11 4 17-3 5-8 6-14 4l-22-7 17 61c2 8-2 13-10 13h-23l-8-38-8 38h-23c-8 0-12-5-10-13l17-61-22 7c-6 2-11 1-14-4-4-6-3-12 4-17Z" fill="#28624a" stroke="#252b28" stroke-width="3.5" stroke-linejoin="round"/>
  <g clip-path="url(#meeple-shape)">
    <path d="m370 137-6 36 35 38-30-3 9 77h21l16-69Z" fill="url(#diagonal-ink)"/>
    <path d="M327 160c-2-9 6-19 16-20M309 207l15-11M317 279l11-45" stroke="#fff7df" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path d="M337 170c4 4 12 4 16 0" stroke="#fff7df" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="335" cy="159" r="2.2" fill="#fff7df"/>
  <circle cx="355" cy="159" r="2.2" fill="#fff7df"/>

  <!-- Coffee cup: rubber-hose limbs, generous silhouette, espresso at the rim. -->
  <g stroke="#252b28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M179 298c-2 18-7 30-17 40m66-40c4 16 8 22 20 29" stroke-width="7"/>
    <path d="M160 331c-9-1-16 4-19 9-4 7-1 12 7 12h24c5 0 8-3 7-8l-2-10-8-3-4 5Z" fill="#252b28" stroke-width="3"/>
    <path d="M144 345h29m-13-11-5 7" stroke="#fff7df" stroke-width="2"/>
    <path d="M246 320c8-3 15 0 19 4l13 12c5 5 2 11-6 11h-28c-6 0-9-4-7-9l4-12Z" fill="#252b28" stroke-width="3"/>
    <path d="M243 340h28m-15-16-3 7m8-3-3 7" stroke="#fff7df" stroke-width="2"/>
    <path d="M150 198c-33-13-55 0-52 25 2 25 22 34 56 22" fill="#f5bd48" stroke-width="3.5"/>
    <path d="M147 210c-20-7-34-1-32 12 1 12 15 16 36 9" fill="#fff7df" stroke-width="3"/>
    <path d="M258 226c17-2 24 9 36 9 8 0 12-4 16-9" stroke-width="6"/>
    <path d="M305 226c1-8 6-14 9-11 2 2-1 7-2 10 3-5 8-6 10-3 2 2-2 6-5 9 5-3 9-2 9 1 0 4-7 8-13 9-5 1-10-3-11-7Z" fill="#fff7df" stroke-width="2.6"/>
    <path d="M148 231c-18 3-18 25-36 38" stroke-width="6"/>
    <path d="M111 262c-5-4-12-3-12 1 0 3 5 5 7 6-7-1-11 2-9 5 1 3 7 3 11 2-5 3-5 7-2 8 5 1 12-6 14-11l-2-7Z" fill="#fff7df" stroke-width="2.6"/>
    <path d="M145 177h120l-12 103c-1 16-20 25-46 25s-44-9-47-25Z" fill="#fff7df" stroke-width="3.5"/>
    <g clip-path="url(#cup-body)">
      <path d="M151 258c32 9 72 10 107-1l-3 30c-29 13-60 13-99 0Z" fill="#f1593d" stroke-width="2.2"/>
      <path d="M247 190c-1 29-4 64-10 88-2 10-9 18-20 25h43l18-115Z" fill="url(#diagonal-ink)" stroke="none"/>
      <path d="m164 202 6 38" stroke="#f5bd48" stroke-width="3"/>
      <path d="m163 274 15 5m-11 2 12 4m58-10 14-4m-14 10 14-4" stroke-width="1.2"/>
    </g>
    <ellipse cx="205" cy="177" rx="60" ry="18" fill="#f5bd48" stroke-width="3.5"/>
    <ellipse cx="205" cy="176" rx="49" ry="10" fill="#252b28" stroke-width="2"/>
    <path d="M183 176c3-5 29-7 39-2 9 4-11 8-22 4-6-2 6-5 12-2" stroke="#fff7df" stroke-width="2.2"/>
    <path d="M179 224c1-5 7-5 8 0m34 0c1-5 7-5 8 0" stroke-width="4"/>
    <path d="M191 238c6 9 16 10 23 0" stroke-width="3"/>
    <path d="m174 233 4 2m53-1 4-2" stroke="#f1593d" stroke-width="3"/>
  </g>

  <!-- Two tactile dice frame the board without concealing the characters. -->
  <g stroke="#252b28" stroke-width="3" stroke-linejoin="round">
    <path d="m59 325 38-21 39 22-38 22Z" fill="#fff7df"/>
    <path d="M59 325v43l39 23v-43Z" fill="#f5bd48"/>
    <path d="m98 348 38-22v43l-38 22Z" fill="#fff7df"/>
    <g fill="#252b28" stroke="none">
      <ellipse cx="82" cy="322" rx="4.2" ry="2.7" transform="rotate(-28 82 322)"/>
      <ellipse cx="101" cy="332" rx="4.2" ry="2.7" transform="rotate(-28 101 332)"/>
      <ellipse cx="99" cy="313" rx="4.2" ry="2.7" transform="rotate(-28 99 313)"/>
      <ellipse cx="118" cy="324" rx="4.2" ry="2.7" transform="rotate(-28 118 324)"/>
      <ellipse cx="71" cy="342" rx="3.4" ry="4.5" transform="rotate(-28 71 342)"/>
      <ellipse cx="85" cy="369" rx="3.4" ry="4.5" transform="rotate(-28 85 369)"/>
      <ellipse cx="117" cy="359" rx="3.4" ry="4.7" transform="rotate(27 117 359)"/>
    </g>
    <path d="m64 361 28 17m-28-10 28 17" stroke-width="1"/>
    <path d="m366 334 32-19 35 20-33 20Z" fill="#fff7df"/>
    <path d="M366 334v38l34 21v-38Z" fill="#fff7df"/>
    <path d="m400 355 33-20v37l-33 21Z" fill="#f1593d"/>
    <g fill="#252b28" stroke="none">
      <ellipse cx="399" cy="335" rx="4.1" ry="2.7"/>
      <ellipse cx="377" cy="352" rx="3.1" ry="4.2" transform="rotate(-28 377 352)"/>
      <ellipse cx="389" cy="359" rx="3.1" ry="4.2" transform="rotate(-28 389 359)"/>
      <ellipse cx="377" cy="365" rx="3.1" ry="4.2" transform="rotate(-28 377 365)"/>
      <ellipse cx="389" cy="373" rx="3.1" ry="4.2" transform="rotate(-28 389 373)"/>
      <ellipse cx="410" cy="357" rx="3" ry="4.3" transform="rotate(28 410 357)"/>
      <ellipse cx="423" cy="348" rx="3" ry="4.3" transform="rotate(28 423 348)"/>
      <ellipse cx="417" cy="367" rx="3" ry="4.3" transform="rotate(28 417 367)"/>
      <ellipse cx="410" cy="382" rx="3" ry="4.3" transform="rotate(28 410 382)"/>
      <ellipse cx="423" cy="373" rx="3" ry="4.3" transform="rotate(28 423 373)"/>
    </g>
  </g>

  <!-- Tiny physical counters finish the tabletop scene. -->
  <g stroke="#252b28" stroke-width="2.5" stroke-linejoin="round">
    <path d="m293 346 14-7 14 8v6l-14 7-14-8Z" fill="#252b28"/>
    <path d="m293 346 14-7 14 8-14 7Z" fill="#f1593d"/>
    <path d="M307 354v6"/>
    <ellipse cx="335" cy="369" rx="12" ry="6" fill="#f5bd48"/>
    <path d="M323 369v5c0 3 5 6 12 6s12-3 12-6v-5" fill="#f5bd48"/>
    <ellipse cx="335" cy="369" rx="12" ry="6" fill="#f5bd48"/>
    <ellipse cx="335" cy="369" rx="6" ry="2.6" stroke-width="1.3"/>
  </g>
</svg>
